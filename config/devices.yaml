# Device addressing for the Trafix LPR parking system.
#
# Switch with TRAFIX_ENV (default below).
#   sim  -> everything on localhost, distinct ports, no hardware needed
#   site -> the real addresses recorded in flow.md §3
#
# Gate "1" is the entry lane, gate "2" the exit lane.

default_env: sim

environments:

  sim:
    # Local-only, matching docker-compose (trafix/trafix/parkways). The old
    # default pointed at the site postgres and made `trafix status` fail with
    # an auth error for anyone without TRAFIX_DB_SITE set. Override with
    # TRAFIX_DB_SIM if you want the simulator on a different database.
    database_url: ${TRAFIX_DB_SIM:-postgresql+psycopg://trafix:trafix@127.0.0.1:5433/parkways}

    broker:
      host: 127.0.0.1
      port: 1883
      keepalive: 30
      username: ${MQTT_USER:-bssparking}
      password: ${MQTT_PASS:-BCTDev_2025}
      client_id_prefix: trafix

    api:
      host: 127.0.0.1
      port: 8000
      base_url: http://127.0.0.1:8000

    # The cashier machine's local gate-open daemon. The real one lives on the
    # Tauri PC (192.168.1.2:8090); in the simulator it is mocks/open_gate.py.
    open_gate_url: ${OPEN_GATE_URL:-http://127.0.0.1:8090/open-gate}

    controllers:
      gate_controller_in:
        gate: "1"
        host: 127.0.0.1
        serial_no: "441D6491AF17"     # the real board's serial, from the capture
      gate_controller_out:
        gate: "2"
        host: 127.0.0.1
        serial_no: "441D6491AF17"     # invented: no exit controller exists on site

    lpr:
      lpr_in:
        gate: "1"
        host: 192.168.1.150
        port: 8000
        base_url: http://192.168.1.150:8000
        public_url: http://192.168.1.150:8000
        # Real LPR terminals (.150 entry, .148 exit) serve a proprietary web UI,
        # not the mock's GET /checklpr. Plates arrive over MQTT; the entry poll
        # 404s and falls back to a no-plate ticket (as production does).
        serves_http: false
      lpr_out:
        gate: "2"
        host: 192.168.1.148
        port: 8000
        base_url: http://192.168.1.148:8000
        public_url: http://192.168.1.148:8000
        serves_http: false

    cameras:
      cam_in:
        host: 127.0.0.1:8148
        snapshot_path: /cgi-bin/snapshot.cgi
      cam_out:
        host: 127.0.0.1:8150
        snapshot_path: /cgi-bin/snapshot.cgi

  # The Docker deployment (`docker compose up`). Broker and database are the
  # compose services; the API and orchestrator run as containers too and reach
  # them by service name. Override the real hardware with env vars in a
  # `.env` next to the compose file: GATE1_SERIAL, GATE2_SERIAL, LPR_IN_HOST,
  # LPR_OUT_HOST, etc.
  docker:
    database_url: ${TRAFIX_DB_DOCKER:-postgresql+psycopg://trafix:trafix@postgres:5432/parkways}

    broker:
      host: mosquitto
      port: 1883
      keepalive: 30
      username: ${MQTT_USER:-bssparking}
      password: ${MQTT_PASS:-BCTDev_2025}
      client_id_prefix: trafix-docker

    api:
      host: 0.0.0.0
      port: 8000
      # Internal name the orchestrator container uses; set TRAFIX_API_URL to
      # the LAN address when running the CLI/cashier from another machine.
      base_url: ${TRAFIX_API_URL:-http://api:8000}

    # Defaults to the local mock daemon; set OPEN_GATE_URL to the cashier
    # PC's real daemon (http://192.168.1.2:8090/open-gate) in deployment.
    open_gate_url: ${OPEN_GATE_URL:-http://127.0.0.1:8090/open-gate}

    controllers:
      gate_controller_in:
        gate: "1"
        host: ${GATE1_HOST:-192.168.1.204}
        serial_no: ${GATE1_SERIAL:-441D6491AF17}
      gate_controller_out:
        gate: "2"
        host: ${GATE2_HOST:-192.168.1.205}
        serial_no: ${GATE2_SERIAL:-441D6491AF18}

    lpr:
      lpr_in:
        gate: "1"
        host: ${LPR_IN_HOST:-192.168.1.130}
        port: 8090
        base_url: ${LPR_IN_URL:-http://192.168.1.130:8090}
        public_url: ${LPR_IN_URL:-http://192.168.1.130:8090}
        # true if the entry unit answers GET /checklpr; false lets the
        # orchestrator issue plate-less tickets (as on site).
        serves_http: true
      lpr_out:
        gate: "2"
        host: ${LPR_OUT_HOST:-192.168.1.149}
        port: 8090
        base_url: ${LPR_OUT_URL:-http://192.168.1.149:8090}
        public_url: ${LPR_OUT_URL:-http://192.168.1.149:8090}
        serves_http: false

    cameras: {}

  # Isolated ports and database for the automated tests.
  e2e:
    database_url: ${TRAFIX_DB_E2E:-postgresql+psycopg://trafix:trafix@127.0.0.1:5433/parkways_e2e}
    broker:
      host: 127.0.0.1
      port: 1883
      keepalive: 30
      username: ${MQTT_USER:-bssparking}
      password: ${MQTT_PASS:-BCTDev_2025}
      client_id_prefix: trafix-e2e
    api:
      host: 127.0.0.1
      port: 8900
      base_url: http://127.0.0.1:8900

    open_gate_url: ${OPEN_GATE_URL:-http://127.0.0.1:8090/open-gate}

    controllers:
      gate_controller_in:
        gate: "1"
        host: 127.0.0.1
        serial_no: "441D6491AF17"
      gate_controller_out:
        gate: "2"
        host: 127.0.0.1
        serial_no: "441D6491AF18"
    lpr:
      lpr_in:
        gate: "1"
        host: 127.0.0.1
        port: 8990
        base_url: http://127.0.0.1:8990
        public_url: http://127.0.0.1:8990
        serves_http: true
      lpr_out:
        gate: "2"
        host: 127.0.0.1
        port: 8991
        base_url: http://127.0.0.1:8991
        public_url: http://127.0.0.1:8991
        serves_http: true
    cameras: {}

  # The live site. Addresses verified from the packet capture + the 2026-08-03
  # LAN sweep (flow.md §3).
  # Device map: .1 server (Laravel + Mosquitto + Postgres), .2 cashier app
  # (Tauri), .3 router (MTN DC:4E:F4), .168 receipt printer (ESC/POS),
  # .182 unidentified (dead Alibaba MQTT session).
  site:
    database_url: ${TRAFIX_DB_SITE:-postgresql+psycopg://postgres:postgres@192.168.1.1:5432/Parkways}

    broker:
      # BROKER_HOST override: when the laptop itself is the broker (docker
      # mosquitto), reachable from WSL2 only at 127.0.0.1 — mirrored WSL2 never
      # hairpins the mirrored LAN IP back to Docker Desktop's published port.
      host: ${BROKER_HOST:-192.168.1.1}
      port: 1883
      keepalive: 30
      username: ${MQTT_USER:-bssparking}
      password: ${MQTT_PASS:-BCTDev_2025}
      # A fixed client_id with a persistent session evicts any other publisher
      # sharing it — flow.md §8. Keep this distinct from the Laravel app's
      # 'payment-subscriber-v3'.
      client_id_prefix: trafix-py

    api:
      host: 0.0.0.0
      port: 8000
      # Env-overridable so a laptop orchestrator can reach a laptop-hosted API
      # during on-site testing instead of the production instance.
      base_url: ${TRAFIX_API_URL:-http://192.168.1.1:8000}

    # The cashier PC (192.168.1.2) hosts the gate-open daemon; the Tauri app
    # POSTs here after settling. No source available — captured on the wire.
    open_gate_url: ${OPEN_GATE_URL:-http://192.168.1.2:8090/open-gate}

    controllers:
      gate_controller_in:
        gate: "1"
        host: 192.168.1.204
        serial_no: "441D6491AF17"
      # No exit controller exists on site (flow.md §7.6). The LAN sweep found
      # only one barrier board (.204, OUI 44:1D:64); no sibling controller.
      # .182 (dead Alibaba MQTT session) is the sole unaccounted device —
      # nmap -sV it before it can be assigned here.
      # gate_controller_out:
      #   gate: "2"
      #   host: 192.168.1.182   # unconfirmed candidate
      #   serial_no: "TBD"

    lpr:
      lpr_in:
        gate: "1"
        host: 192.168.1.130
        port: 8090
        base_url: http://192.168.1.130:8090
        public_url: http://192.168.1.130:8090
        # ⚠️ 2026-08-03 probe: :8090 is now POST-only (pw-signage-server).
        # GET /checklpr → 405; POST form plate_num → {"error_num":0,...} ACK;
        # JSON body → connection dropped. The plate-read GET is dead, so entry
        # falls back to NO_PLATE until the client is switched to POST.
        serves_http: true
      lpr_out:
        gate: "2"
        # The wire topic uses gate 1 even though the lane is logically gate 2 —
        # the captured announcements are `gate/out/1/pos` (flow.md §8).
        pos_topic_gate: "1"
        host: 192.168.1.149
        port: 8090
        base_url: http://192.168.1.149:8090
        public_url: http://192.168.1.149:8090
        # ⚠️ .149 is reachable (SSH :22, Boa :80, VNC :5900) and :8090
        # (pw-signage-gateout-server) is open but POST-only: every body sent
        # was dropped (empty reply) — contract unconfirmed (flow.md §7.2).
        # Plates arrive over MQTT; never poll it via HTTP GET.
        serves_http: false

    cameras:
      cam_in:
        host: 192.168.1.148
        # The site uses Dahua's snapshot.cgi path against Uniview cameras and
        # sends no auth, which is why all 21 attempts 404 (flow.md §7.5).
        # Uniview's own path is below; confirm against the camera's firmware.
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      cam_out:
        host: 192.168.1.150
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      # Discovered 2026-08-03 LAN sweep (flow.md §3). Lane roles unconfirmed
      # and not consumed by the runtime yet. Uniview units (OUI C4:79:05) use
      # /images/snapshot.jpg; the 88:26:3F units serve HTTP :80 + RTSP :554,
      # snapshot path unverified.
      cam_04:
        host: 192.168.1.4
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      cam_09:
        host: 192.168.1.9
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      cam_33:
        host: 192.168.1.33
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      cam_06:
        host: 192.168.1.6
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      cam_07:
        host: 192.168.1.7
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      cam_08:
        host: 192.168.1.8
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      cam_34:
        host: 192.168.1.34
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}
      cam_36:
        host: 192.168.1.36
        snapshot_path: /images/snapshot.jpg
        username: ${CAM_USER:-admin}
        password: ${CAM_PASS:-}

    printers:
      # Network receipt printer, ESC/POS over TCP. Referenced as
      # connector_descriptor in mqtt_app_lpr/config/receiptprinter.php:22.
      # Offline during the 2026-08-03 sweep. Not consumed by the runtime yet.
      receipt:
        host: 192.168.1.168

# Behaviour, applied in every environment.
policies:
  lpr_timeout_seconds: 5.0
  lpr_retries: 1

  # Ignore repeat presses of the ticket button within this many seconds.
  button_debounce_seconds: 5.0

  # Matches the only relay command ever seen on site: relay1 1000ms, beep 100ms.
  barrier_pulse_ms: 1000
  barrier_beep_ms: 100

  # FIX for flow.md §7.6. Production sends nothing to the exit barrier; how it
  # physically opens is undetermined. We publish an outputCtrl to /GATE/OUT/{gate}.
  # Set false to reproduce production behaviour (exit never commanded).
  command_exit_barrier: true

  # FIX for §7.7. The two cameras disagree about plate strings and 4 of 6 entry
  # tickets recorded no plate at all, so a plate can never be the lookup key.
  # The ticket code is authoritative; the plate is advisory and only recorded.
  # Set true to refuse exit when the plates disagree.
  require_plate_match: false

  storage_dir: storage
